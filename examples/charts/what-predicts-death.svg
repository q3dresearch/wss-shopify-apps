<text x="28.0" y="564.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Shopify, 2026-09-25, random.seed(20260925). Live ratings read from the page today; DEAD ones from each app's last Internet Archive</text>
<text x="28.0" y="577.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">capture, so they predate the delisting by an unknown margin. THE DEAD SAMPLE IS DOUBLY FILTERED: 19 of 70 have no archived page at</text>
<text x="28.0" y="590.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">all, and only 13 carry a rating — so 'dead apps are less often rated' is partly a statement about Archive coverage. n=25 and n=13 is</text>
<text x="28.0" y="603.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">thin; read it as directional.</text>
