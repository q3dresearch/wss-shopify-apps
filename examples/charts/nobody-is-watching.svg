<text x="214.0" y="383.0" font-size="11.5" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums">Shopify App Store</text>
<text x="214.0" y="424.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">An absent archive is the strongest reason to capture, not the weakest. The five above</text>
<text x="214.0" y="438.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">are partly held by somebody else. This one is not held at all, so every week</text>
<text x="214.0" y="452.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">unrecorded is gone.</text>
<line x1="28" y1="494.0" x2="852" y2="494.0" stroke="#e3e2db"/>
<text x="28.0" y="510.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Internet Archive CDX, collapsed on digest, 2026-09-25. Counted against each marketplace's own listing index -- sitemap_apps_en.xml</text>
<text x="28.0" y="523.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">for Shopify, sitemap.xml for the others, sitemap-listings.xml for Atlassian. A zero here is a measured absence, not an unqueried</text>
<text x="28.0" y="536.0" font-size="10" fill="#8a8880" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">one: CDX answered 200 with an empty result.</text>
